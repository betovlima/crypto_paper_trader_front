name: LightGBM frontend validation

on:
  push:
    branches:
      - feature/lightgbm-ui-v3-20261108
      - feature/crypto-research-workspace-ui-v4-20261108
      - feature/btc-capital-rotation-ui-v5-20261108
      - feature/one-click-btc-research-ui-v6-20261108
      - feature/btc-calibrated-capital-ui-v7-20261108
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run btc-forecast:check
      - run: node --test scripts/test-strategy-campaign.mjs
      - run: npm run i18n:check
      - run: npm run ui:check
